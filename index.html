<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>My Booking 360</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-title" content="My Booking 360">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow call-sheet column, sticky header, thumb-reach tab bar; status colour is the main signal. */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface-2:#E8ECF3; --line:#D3DAE5;
  --ink:#131A2A; --ink-2:#465166; --ink-3:#768297;
  --accent:#2C59D1; --accent-ink:#FFFFFF; --accent-soft:#E1E8FA;
  --st-blocked:#6A5DA8; --st-heavy:#B8740A; --st-confirmed:#1D8452; --st-completed:#2C59D1; --st-notdone:#C13F2B; --st-cancelled:#8892A3;
  --good:#1D8452; --warn:#B8740A; --bad:#C13F2B;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:12px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D121C; --surface:#151C29; --surface-2:#1D2636; --line:#2A3446;
  --ink:#E7ECF4; --ink-2:#A9B3C4; --ink-3:#7C879A;
  --accent:#7096F2; --accent-ink:#0D121C; --accent-soft:#1C2846;
  --st-blocked:#A296E4; --st-heavy:#E9A73C; --st-confirmed:#43C083; --st-completed:#7096F2; --st-notdone:#EF6E58; --st-cancelled:#8A94A6;
  --good:#43C083; --warn:#E9A73C; --bad:#EF6E58; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D121C; --surface:#151C29; --surface-2:#1D2636; --line:#2A3446;
  --ink:#E7ECF4; --ink-2:#A9B3C4; --ink-3:#7C879A;
  --accent:#7096F2; --accent-ink:#0D121C; --accent-soft:#1C2846;
  --st-blocked:#A296E4; --st-heavy:#E9A73C; --st-confirmed:#43C083; --st-completed:#7096F2; --st-notdone:#EF6E58; --st-cancelled:#8A94A6;
  --good:#43C083; --warn:#E9A73C; --bad:#EF6E58; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:780px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.mark{width:34px;height:34px;border-radius:9px;background:var(--ink);color:var(--surface);display:grid;place-items:center;font:800 13px/1 var(--f-display);font-stretch:80%;flex:none}
.brand h1{margin:0;font:750 19px/1.1 var(--f-display);font-stretch:82%;letter-spacing:.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font:500 11px/1.2 var(--f-body);color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;min-height:40px;text-decoration:none;color:var(--ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.cur{position:relative;flex:none}
.cur select{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:10px;min-height:40px;padding:8px 28px 8px 11px;font:600 14px var(--f-mono);cursor:pointer}
.cur::after{content:"";position:absolute;right:11px;top:50%;width:7px;height:7px;border-right:2px solid var(--ink-2);border-bottom:2px solid var(--ink-2);transform:translateY(-70%) rotate(45deg);pointer-events:none}
@media (max-width:420px){.top .btn.primary span{display:none}}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.danger.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:18px;height:18px}

main{padding-block:16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.banner{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--ink-2)}
.banner b{color:var(--ink)}
.banner.warn{border-color:color-mix(in srgb,var(--warn) 45%,var(--line));background:color-mix(in srgb,var(--warn) 8%,var(--surface))}
.banner > span{flex:1;min-width:200px}

h2.sec{margin:0;font:700 13px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec-block{display:flex;flex-direction:column;gap:10px}
.greet{font:750 28px/1.1 var(--f-display);font-stretch:78%;margin:0;text-wrap:balance}
.greet span{color:var(--ink-3);font-weight:600}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:620px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0;text-align:left}
.stat .lbl{font-size:12px;color:var(--ink-3);font-weight:500}
.stat .val{font:600 20px/1.15 var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .sub{font-size:12px;color:var(--ink-2)}
.stat.bad .val{color:var(--bad)}

.list{display:flex;flex-direction:column;gap:8px}
.job{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--stc);border-radius:var(--r);padding:10px 12px}
.job:hover{border-color:color-mix(in srgb,var(--stc) 50%,var(--line));border-left-color:var(--stc)}
.job.st-heavy{border-left-style:dashed}
.job.st-cancelled .job-title{text-decoration:line-through;color:var(--ink-3)}
.job-date{display:flex;flex-direction:column;align-items:center;line-height:1}
.job-date b{font:700 22px/1 var(--f-display);font-stretch:80%}
.job-date small{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin-top:3px}
.job-main{display:flex;flex-direction:column;gap:3px;min-width:0}
.job-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.job-sub{font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.job-meta{display:flex;gap:6px;flex-wrap:wrap}
.job-amt{font:500 14px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink-2);text-align:right}
.st-blocked{--stc:var(--st-blocked)}.st-heavy{--stc:var(--st-heavy)}.st-confirmed{--stc:var(--st-confirmed)}
.st-completed{--stc:var(--st-completed)}.st-notdone{--stc:var(--st-notdone)}.st-cancelled{--stc:var(--st-cancelled)}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;color:var(--stc,var(--ink-2));background:color-mix(in srgb,var(--stc,var(--ink-3)) 13%,transparent);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.st-heavy::before{background:transparent;border:1.5px dashed currentColor;width:6px;height:6px}
.pill.st-blocked::before{border-radius:2px}
.pp-paid{--stc:var(--good)}.pp-overdue{--stc:var(--bad)}.pp-part{--stc:var(--warn)}.pp-sent{--stc:var(--accent)}.pp-draft{--stc:var(--ink-3)}
.tag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--surface-2);color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:22px 18px;text-align:center;color:var(--ink-2);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{color:var(--ink);font-size:16px}

.attn{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.attn button{display:flex;gap:10px;align-items:center;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 14px;width:100%}
.attn button:first-child{border-top:0}
.attn .dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--stc)}
.attn .t{flex:1;min-width:0}
.attn .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.attn .t small{color:var(--ink-2);font-size:13px}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:180px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;min-height:40px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.month-h{font:700 15px/1 var(--f-display);font-stretch:85%;letter-spacing:.02em;color:var(--ink-2);margin:8px 0 0;display:flex;justify-content:space-between}
.month-h span{font:500 13px var(--f-mono);color:var(--ink-3)}

/* calendar */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cal-nav{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line)}
.cal-nav h3{margin:0;font:750 19px/1 var(--f-display);font-stretch:80%}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-dow{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);text-align:center;padding:8px 0;border-bottom:1px solid var(--line)}
.cal-day{min-height:74px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 3px;display:flex;flex-direction:column;gap:2px;background:none;border-top:0;border-left:0;text-align:left;min-width:0}
.cal-day:nth-child(7n){border-right:0}
.cal-day .dn{font:500 12px var(--f-mono);color:var(--ink-2);padding:1px 3px;border-radius:5px;align-self:flex-start}
.cal-day.other .dn{color:var(--ink-3);opacity:.55}
.cal-day.today .dn{background:var(--accent);color:var(--accent-ink)}
.cal-day.sel{background:var(--accent-soft)}
.cal-bar{font-size:10.5px;line-height:1.25;font-weight:600;padding:1px 4px;border-radius:4px;color:var(--stc);background:color-mix(in srgb,var(--stc) 16%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-bar.st-heavy{outline:1px dashed var(--stc);outline-offset:-1px;background:transparent}
.cal-bar.st-blocked{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--stc) 22%,transparent) 0 4px,transparent 4px 8px)}
.cal-bar.st-cancelled{text-decoration:line-through;opacity:.7}
.cal-more{font-size:10px;color:var(--ink-3);padding-left:4px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--ink-2)}

/* cards & forms */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.client-row{display:flex;justify-content:space-between;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.client-row .t{min-width:0}
.client-row b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.client-row small{color:var(--ink-2);font-size:13px}
.client-row .r{text-align:right;font-size:13px;color:var(--ink-2);flex:none}
.av{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:700 13px var(--f-display);flex:none}

.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field > span{font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:.02em}
.field input,.field select,.field textarea,.inp{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 11px;min-height:42px}
.field textarea{min-height:80px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:520px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.hint{font-size:12px;color:var(--ink-3)}
.warnbox{font-size:13px;padding:9px 11px;border-radius:9px;background:color-mix(in srgb,var(--warn) 12%,transparent);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:500}
.switch input{width:44px;height:26px;appearance:none;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;position:relative;flex:none;transition:background .15s}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked{background:var(--accent);border-color:var(--accent)}
.switch input:checked::after{transform:translateX(18px)}
.status-pick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.status-pick button{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 6px;font-size:13px;font-weight:600;color:var(--stc);display:flex;align-items:center;justify-content:center;gap:6px;min-height:40px}
.status-pick button[aria-pressed="true"]{background:var(--stc);border-color:var(--stc);color:var(--surface)}
.status-pick button.st-heavy{border-style:dashed}

.items{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:minmax(0,1fr) 64px 92px 90px 34px;gap:6px;align-items:center}
.item .amt{text-align:right;font:500 13px var(--f-mono);font-variant-numeric:tabular-nums}
.item .inp{min-height:38px;padding:7px 8px;font-size:14px}
@media (max-width:560px){.item{grid-template-columns:minmax(0,1fr) 58px 84px 34px}.item .desc{grid-column:1/-1}.item .amt{display:none}}
.xbtn{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink-3);display:grid;place-items:center}
.totals{display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-size:14px;justify-items:end}
.totals span:nth-child(odd){color:var(--ink-2);justify-self:start}
.totals .grand{font-weight:700;font-size:16px;color:var(--ink)!important}

.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px 12px;margin:0;font-size:14px}
.kv dt{color:var(--ink-3);font-weight:500}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.copy{border:0;background:none;color:var(--accent);font-weight:600;font-size:13px;padding:0 0 0 8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.spacer{flex:1}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{font-size:12px;text-align:left;color:var(--ink-3);font-weight:600;padding:6px 4px;border-bottom:1px solid var(--line)}
table.t th.r{text-align:right}
table.t td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top}
table.t .r{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tscroll{overflow-x:auto}
.pay{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.pay:last-child{border-bottom:0}

.chart-box{position:relative;height:230px}
.bar-list{display:flex;flex-direction:column;gap:8px}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:13px}
.bar-row .track{grid-column:1/-1;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar-row .track i{display:block;height:100%;background:var(--accent);border-radius:3px}

/* nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs-in{max-width:780px;margin:0 auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));height:var(--nav-h)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink-3)}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,14,22,.45)}
.sheet-card{background:var(--bg);width:100%;max-width:780px;height:calc(100% - env(safe-area-inset-top,0px) - 12px);border-radius:16px 16px 0 0;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
@media (min-width:820px){.sheet{align-items:center}.sheet-card{height:min(92%,900px);border-radius:16px}}
.sheet-head{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.sheet-head h2{flex:1;margin:0;font:750 18px/1.15 var(--f-display);font-stretch:82%;text-align:center;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.sheet-foot{display:flex;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line)}
.sheet-foot .btn{flex:1}
.detail-head{display:flex;flex-direction:column;gap:6px}
.detail-head h3{margin:0;font:750 26px/1.1 var(--f-display);font-stretch:78%;text-wrap:balance}
.detail-head .when{color:var(--ink-2);font-size:14px}

.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:500;max-width:min(92vw,520px);box-shadow:0 6px 20px rgba(0,0,0,.25);text-align:center}
.toast.err{background:var(--bad);color:#fff}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top"><div class="top-in">
  <div class="brand"><div class="mark" aria-hidden="true">360</div><div style="min-width:0"><h1>My Booking 360</h1><small id="topSub">Bookings · Invoices · Money</small></div></div>
  <label class="cur" title="Currency"><span class="sr">Currency</span><select id="curSel" aria-label="Currency"></select></label>
  <button class="btn primary" data-act="newJob" aria-label="New booking"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span>Booking</span></button>
</div></header>

<main><div class="wrap" id="view"></div></main>

<nav class="tabs" aria-label="Sections"><div class="tabs-in" id="tabs"></div></nav>
<div class="sheet" id="sheet" hidden><div class="sheet-card" id="sheetCard" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
"use strict";
/* ---------- constants ---------- */
const STATUSES=[
  {k:'blocked',label:'Blocked off',gcal:'3'},
  {k:'heavy',label:'Heavy pencil',gcal:'5'},
  {k:'confirmed',label:'Confirmed',gcal:'10'},
  {k:'completed',label:'Completed',gcal:'9'},
  {k:'notdone',label:'Not completed',gcal:'11'},
  {k:'cancelled',label:'Cancelled',gcal:'8'},
];
const ST=Object.fromEntries(STATUSES.map(s=>[s.k,s]));
const UNITS=['day','half day','hour','item','km','flat'];
const CURRENCIES=[['ZAR','South African rand'],['BWP','Botswana pula'],['NAD','Namibian dollar'],['KES','Kenyan shilling'],['MUR','Mauritian rupee'],['AUD','Australian dollar'],['NZD','New Zealand dollar'],['USD','US dollar'],['GBP','British pound'],['EUR','Euro'],['CAD','Canadian dollar'],['SGD','Singapore dollar'],['HKD','Hong Kong dollar'],['AED','UAE dirham'],['INR','Indian rupee'],['JPY','Japanese yen']];
const curOptions=sel=>{const list=CURRENCIES.some(c=>c[0]===sel)?CURRENCIES:[[sel,sel],...CURRENCIES];return list.map(([k,n])=>`<option value="${esc(k)}" ${k===sel?'selected':''}>${esc(k)} · ${esc(n)}</option>`).join('')};
const METHODS=['EFT','Instant EFT / PayShap','Card','Cash','SnapScan / Zapper','Other'];
const DEFAULTS={businessName:'',ownerName:'',abn:'',email:'',phone:'',address:'',gstRegistered:true,gstRate:15,currency:'ZAR',
  termsDays:30,invoicePrefix:'INV-',nextInvoiceNo:1001,bankName:'',accountName:'',bsb:'',accountNo:'',accountType:'',swift:'',regNo:'',travelRate:4.76,timeZone:'Africa/Johannesburg',region:'ZA',
  invoiceNotes:'Thank you for your business.',defaultRate:0,defaultUnit:'day',crew:'',autoSync:true};
const ICONS={
  home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  jobs:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',
  clients:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/>',
  money:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  more:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/>'};
const TABS=[['home','Home'],['jobs','Jobs'],['cal','Calendar'],['clients','Clients'],['money','Money'],['more','Settings']];

/* ---------- state ---------- */
const S={mode:'loading',db:null,mcp:null,dl:null,settings:{...DEFAULTS},clients:[],jobs:[],
  view:'home',jobFilter:'upcoming',search:'',clientSearch:'',calMonth:null,calSel:null,draft:null,openJobId:null,charts:[]};

/* ---------- utils ---------- */
const $=(s,el=document)=>el.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pd=s=>{if(!s)return null;const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const fmtD=(s,o={weekday:'short',day:'numeric',month:'short'})=>s?pd(s).toLocaleDateString('en-ZA',o):'';
const fmtRange=(a,b)=>!b||a===b?fmtD(a):`${fmtD(a)} – ${fmtD(b)}`;
const fmtLong=s=>fmtD(s,{day:'numeric',month:'long',year:'numeric'});
const money=n=>{try{return new Intl.NumberFormat('en-ZA',{style:'currency',currency:S.settings.currency||'ZAR'}).format(n||0)}catch{return 'R '+(+n||0).toFixed(2)}};
const moneyShort=n=>{try{return new Intl.NumberFormat('en-ZA',{style:'currency',currency:S.settings.currency||'ZAR',notation:'compact',maximumFractionDigits:1}).format(n||0)}catch{return String(n)}};
const newId=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-5);
const r2=n=>Math.round((+n||0)*100)/100;
const clone=o=>JSON.parse(JSON.stringify(o));
const client=id=>S.clients.find(c=>c.id===id);
const jobEnd=j=>j.end||j.start;
const initials=n=>(n||'?').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const daysBetween=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const bookDays=d=>d.start?Math.max(1,daysBetween(d.start,d.end&&d.end>d.start?d.end:d.start)+1):1;

function totals(j){
  const sub=r2((j.items||[]).reduce((a,i)=>a+(+i.qty||0)*(+i.rate||0),0));
  const rate=j.invoice?.gstRate ?? (+S.settings.gstRate||0);
  const gst=j.gst?r2(sub*rate/100):0;
  const total=r2(sub+gst);
  const paid=r2((j.payments||[]).reduce((a,p)=>a+(+p.amount||0),0));
  return {sub,gst,total,paid,balance:r2(total-paid),rate};
}
function payState(j){
  if(!j.invoice)return null;
  const t=totals(j);
  if(t.total>0&&t.balance<=0)return 'paid';
  if(j.invoice.due&&j.invoice.due<today())return 'overdue';
  if(t.paid>0)return 'part';
  return j.invoice.sentAt?'sent':'draft';
}
const PAYLBL={paid:'Paid',overdue:'Overdue',part:'Part paid',sent:'Invoiced',draft:'Invoice not sent'};
const stPill=k=>`<span class="pill st-${k}">${esc(ST[k]?.label||k)}</span>`;
const payPill=p=>p?`<span class="pill pp-${p}">${PAYLBL[p]}</span>`:'';

function toast(msg,err){const t=$('#toast');t.textContent=msg;t.className='toast'+(err?' err':'');t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,err?6000:3200)}
async function copyText(txt){try{await navigator.clipboard.writeText(txt);toast('Copied')}catch{toast('Copy not available here — press and hold to select it')}}

/* ---------- data layer ---------- */
const LKEY='mb360-local';
function localLoad(){try{const d=JSON.parse(localStorage.getItem(LKEY)||'{}');S.jobs=d.jobs||[];S.clients=d.clients||[];S.settings=withRegion(d.settings||{})}catch{}}
function withRegion(d){const s={...DEFAULTS,...d};if(!d.region){s.currency='ZAR';s.gstRate=15;s.region='ZA';s.timeZone=s.timeZone||'Africa/Johannesburg'}return s}
function localSave(){try{localStorage.setItem(LKEY,JSON.stringify({jobs:S.jobs,clients:S.clients,settings:S.settings}))}catch{}}
function upsertLocal(arr,obj){const i=arr.findIndex(x=>x.id===obj.id);if(i>=0)arr[i]=obj;else arr.push(obj)}
function dbErr(e){
  if(e?.code==='quota_exceeded')toast('Storage is full. Delete some old jobs, then try again.',1);
  else if(e?.code==='invalid_argument')toast('Only the owner of this app can save changes.',1);
  else toast('Could not save. Check your connection and try again.',1);
  throw e;
}
const store={
  async saveJob(j){j.updatedAt=Date.now();if(S.db){try{await S.db.doc('jobs/'+j.id).set(clone(j))}catch(e){dbErr(e)}}else{upsertLocal(S.jobs,clone(j));localSave();sortJobs();render()}},
  async deleteJob(id){if(S.db){try{await S.db.doc('jobs/'+id).delete()}catch(e){dbErr(e)}}else{S.jobs=S.jobs.filter(j=>j.id!==id);localSave();render()}},
  async saveClient(c){c.updatedAt=Date.now();if(S.db){try{await S.db.doc('clients/'+c.id).set(clone(c))}catch(e){dbErr(e)}}else{upsertLocal(S.clients,clone(c));localSave();render()}},
  async deleteClient(id){if(S.db){try{await S.db.doc('clients/'+id).delete()}catch(e){dbErr(e)}}else{S.clients=S.clients.filter(c=>c.id!==id);localSave();render()}},
  async saveSettings(s){S.settings={...S.settings,...s};if(S.db){try{await S.db.doc('settings/main').set(clone(S.settings))}catch(e){dbErr(e)}}else{localSave();render()}}
};
function sortJobs(){S.jobs.sort((a,b)=>(a.start||'').localeCompare(b.start||'')||(a.callTime||'').localeCompare(b.callTime||''))}

async function boot(){
  const now=new Date();S.calMonth=iso(new Date(now.getFullYear(),now.getMonth(),1));S.calSel=today();
  renderTabs();render();
  const use=n=>(window.claude&&window.claude.use)?window.claude.use(n).catch(()=>null):Promise.resolve(null);
  const [db,user,mcp,dl]=await Promise.all([use('db'),use('user'),use('mcp'),use('downloads')]);
  S.mcp=mcp;S.dl=dl;
  if(!db){S.mode='local';localLoad();sortJobs();render();return}
  let owner=true;try{if(user&&user.isOwner){const v=await user.isOwner();owner=v!==false}}catch{}
  if(!owner){S.mode='notowner';render();return}
  S.db=db;S.mode='live';
  let got=0;const ready=()=>{if(++got>=3){S.loaded=true}render()};
  db.doc('settings/main').onSnapshot(s=>{S.settings=withRegion(s.exists?s.data():{});ready()},()=>ready());
  db.collection('clients').onSnapshot(s=>{S.clients=s.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>(a.name||'').localeCompare(b.name||''));ready()},()=>ready());
  db.collection('jobs').onSnapshot(s=>{S.jobs=s.docs.map(d=>({...d.data(),id:d.id}));sortJobs();ready()},()=>ready());
}

/* ---------- rendering ---------- */
function renderTabs(){
  $('#tabs').innerHTML=TABS.map(([k,l])=>`<button class="tab" data-act="tab" data-v="${k}" ${S.view===k?'aria-current="page"':''}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]}</svg>${l}</button>`).join('');
}
function render(){
  S.charts.forEach(c=>{try{c.destroy()}catch{}});S.charts=[];
  const v=$('#view'),cs=$('#curSel'),cur=S.settings.currency||'ZAR';
  if(cs.dataset.v!==cur){cs.innerHTML=CURRENCIES.some(c=>c[0]===cur)?CURRENCIES.map(([k])=>`<option value="${k}" ${k===cur?'selected':''}>${k}</option>`).join(''):`<option selected>${esc(cur)}</option>`+CURRENCIES.map(([k])=>`<option>${k}</option>`).join('');cs.dataset.v=cur}
  cs.disabled=S.mode==='loading'||S.mode==='notowner';
  if(S.mode==='loading'){v.innerHTML=`<div class="empty"><div class="spin"></div><span>Loading your bookings…</span></div>`;return}
  if(S.mode==='notowner'){v.innerHTML=`<div class="empty"><b>This booking book is private</b><span>Only its owner can see and change the bookings, clients and invoices in My Booking 360.</span></div>`;return}
  const views={home:vHome,jobs:vJobs,cal:vCal,clients:vClients,money:vMoney,more:vMore};
  v.innerHTML=banners()+(views[S.view]||vHome)();
  if(S.view==='money')drawCharts();
  if(S.openJobId&&!$('#sheet').hidden&&$('#sheetCard').dataset.kind==='job')openJob(S.openJobId,true);
}
function banners(){
  let b='';
  if(S.mode==='local')b+=`<div class="banner warn"><span><b>Saved on this device only.</b> Open My Booking 360 from claude.ai while signed in to keep bookings in your account, sync your calendar and email invoices.</span></div>`;
  if(S.jobs.some(j=>j.example)||S.clients.some(c=>c.example))b+=`<div class="banner"><span><b>You are looking at example bookings.</b> They show how the app works. Remove them when you are ready to add your own.</span><button class="btn sm" data-act="clearExamples">Remove examples</button></div>`;
  if(S.mode==='live'&&S.loaded&&!S.settings.businessName)b+=`<div class="banner"><span><b>Add your business details</b> so your invoices show your name, VAT number and bank details.</span><button class="btn sm" data-act="tab" data-v="more">Set up</button></div>`;
  return b;
}
function jobCard(j){
  const c=client(j.clientId),t=totals(j),d=pd(j.start)||new Date();
  const sub=[c?.name||'No client',j.engineer,j.venue].filter(Boolean).map(esc).join(' · ');
  return `<button class="job st-${j.status}" data-act="openJob" data-id="${j.id}">
    <span class="job-date"><b>${d.getDate()}</b><small>${d.toLocaleDateString('en-ZA',{month:'short'})}</small></span>
    <span class="job-main"><span class="job-title">${esc(j.title||'Untitled job')}</span><span class="job-sub">${sub}${jobEnd(j)!==j.start?` · ${daysBetween(j.start,jobEnd(j))+1} days`:''}</span>
    <span class="job-meta">${stPill(j.status)}${payPill(payState(j))}${j.example?'<span class="tag">Example</span>':''}</span></span>
    <span class="job-amt">${t.total?money(t.total):''}</span></button>`;
}
function emptyJobs(msg){return `<div class="empty"><b>${msg}</b><span>Add a booking with the dates, client, engineer and rates. You can hold dates as a heavy pencil and confirm later.</span><button class="btn primary" data-act="newJob">Add a booking</button></div>`}

function attention(){
  const t=today(),out=[];
  S.jobs.forEach(j=>{
    const ps=payState(j),c=client(j.clientId)?.name||'No client';
    if(ps==='overdue')out.push({j,st:'notdone',w:0,b:`Overdue: ${j.invoice.no} · ${money(totals(j).balance)}`,s:`${c} · due ${fmtD(j.invoice.due)}`});
    else if(j.status==='completed'&&!j.invoice&&totals(j).total>0)out.push({j,st:'completed',w:1,b:`Ready to invoice: ${j.title}`,s:`${c} · ${money(totals(j).total)}`});
    else if(j.status==='confirmed'&&jobEnd(j)<t)out.push({j,st:'confirmed',w:2,b:`Did this job go ahead? ${j.title}`,s:`Ended ${fmtD(jobEnd(j))} · mark it completed or not completed`});
    else if(j.status==='heavy'&&j.start>=t&&daysBetween(t,j.start)<=14)out.push({j,st:'heavy',w:3,b:`Pencil to confirm: ${j.title}`,s:`${c} · starts ${fmtD(j.start)}`});
  });
  return out.sort((a,b)=>a.w-b.w).slice(0,8);
}
function vHome(){
  const t=today(),wk=addDays(t,7),m=t.slice(0,7);
  const live=S.jobs.filter(j=>j.status!=='cancelled');
  const next7=live.filter(j=>jobEnd(j)>=t&&j.start<=wk&&j.status!=='blocked');
  const inv=S.jobs.filter(j=>j.invoice&&j.status!=='cancelled');
  const outstanding=r2(inv.reduce((a,j)=>a+Math.max(0,totals(j).balance),0));
  const od=inv.filter(j=>payState(j)==='overdue');
  const odAmt=r2(od.reduce((a,j)=>a+totals(j).balance,0));
  const recM=r2(S.jobs.flatMap(j=>j.payments||[]).filter(p=>(p.date||'').startsWith(m)).reduce((a,p)=>a+(+p.amount||0),0));
  const upcoming=live.filter(j=>jobEnd(j)>=t).slice(0,6);
  const att=attention();
  const name=(S.settings.ownerName||'').split(' ')[0];
  return `<p class="greet">${name?`Hi ${esc(name)}. `:''}<span>${fmtD(t,{weekday:'long',day:'numeric',month:'long'})}</span></p>
  <div class="stats">
    <button class="stat" data-act="tab" data-v="cal"><span class="lbl">Next 7 days</span><span class="val">${next7.length}</span><span class="sub">${next7.length===1?'booking':'bookings'}</span></button>
    <button class="stat" data-act="tab" data-v="money"><span class="lbl">Owed to you</span><span class="val">${money(outstanding)}</span><span class="sub">${inv.filter(j=>totals(j).balance>0).length} unpaid invoices</span></button>
    <button class="stat ${odAmt>0?'bad':''}" data-act="tab" data-v="money"><span class="lbl">Overdue</span><span class="val">${money(odAmt)}</span><span class="sub">${od.length} ${od.length===1?'invoice':'invoices'}</span></button>
    <button class="stat" data-act="tab" data-v="money"><span class="lbl">Paid this month</span><span class="val">${money(recM)}</span><span class="sub">${fmtD(t,{month:'long'})}</span></button>
  </div>
  ${att.length?`<div class="sec-block"><h2 class="sec">Needs your attention</h2><div class="attn">${att.map(a=>`<button data-act="openJob" data-id="${a.j.id}" class="st-${a.st}"><span class="dot"></span><span class="t"><b>${esc(a.b)}</b><small>${esc(a.s)}</small></span></button>`).join('')}</div></div>`:''}
  <div class="sec-block"><h2 class="sec">Coming up <button class="btn sm ghost" data-act="tab" data-v="jobs">All jobs</button></h2>
  ${upcoming.length?`<div class="list">${upcoming.map(jobCard).join('')}</div>`:emptyJobs('No upcoming bookings')}</div>`;
}

const FILTERS=[['upcoming','Upcoming'],['all','All'],...STATUSES.map(s=>[s.k,s.label]),['unpaid','Unpaid invoices']];
function vJobs(){
  const t=today(),q=S.search.trim().toLowerCase();
  let js=S.jobs.slice();
  const f=S.jobFilter;
  if(f==='upcoming')js=js.filter(j=>jobEnd(j)>=t&&j.status!=='cancelled');
  else if(f==='unpaid')js=js.filter(j=>j.invoice&&totals(j).balance>0);
  else if(f!=='all')js=js.filter(j=>j.status===f);
  if(q)js=js.filter(j=>[j.title,j.engineer,j.role,j.venue,j.address,j.po,j.notes,client(j.clientId)?.name,j.invoice?.no].join(' ').toLowerCase().includes(q));
  if(f!=='upcoming')js.reverse();
  const groups=[];js.forEach(j=>{const k=(j.start||'').slice(0,7);let g=groups[groups.length-1];if(!g||g.k!==k)groups.push(g={k,js:[]});g.js.push(j)});
  return `<div class="toolbar"><input class="search" id="jobSearch" type="search" placeholder="Search jobs, clients, engineers, venues" value="${esc(S.search)}" aria-label="Search jobs"></div>
  <div class="chips" role="group" aria-label="Filter jobs">${FILTERS.map(([k,l])=>`<button class="chip" data-act="jobFilter" data-v="${k}" aria-pressed="${f===k}">${l} <span class="num" style="opacity:.6">${countFilter(k)}</span></button>`).join('')}</div>
  ${groups.length?groups.map(g=>`<div class="sec-block"><h3 class="month-h">${g.k?fmtD(g.k+'-01',{month:'long',year:'numeric'}):'No date'}<span>${money(g.js.filter(j=>j.status!=='cancelled').reduce((a,j)=>a+totals(j).total,0))}</span></h3><div class="list">${g.js.map(jobCard).join('')}</div></div>`).join(''):(S.jobs.length?`<div class="empty"><b>No jobs match</b><span>Try another filter or search.</span></div>`:emptyJobs('No bookings yet'))}`;
}
function countFilter(k){const t=today();
  if(k==='upcoming')return S.jobs.filter(j=>jobEnd(j)>=t&&j.status!=='cancelled').length;
  if(k==='all')return S.jobs.length;
  if(k==='unpaid')return S.jobs.filter(j=>j.invoice&&totals(j).balance>0).length;
  return S.jobs.filter(j=>j.status===k).length}

function jobsOnDay(d){return S.jobs.filter(j=>j.start<=d&&jobEnd(j)>=d)}
function vCal(){
  const m=pd(S.calMonth),y=m.getFullYear(),mo=m.getMonth();
  const first=new Date(y,mo,1),off=(first.getDay()+6)%7,start=new Date(y,mo,1-off);
  const t=today();let cells='';
  for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const s=iso(d);
    if(i===35&&d.getMonth()!==mo)break;
    const js=jobsOnDay(s);

/* ---------- money ---------- */
function monthsWindow(){const n=new Date(),out=[];for(let i=-9;i<=2;i++){const d=new Date(n.getFullYear(),n.getMonth()+i,1);out.push(iso(d).slice(0,7))}return out}
function finSeries(){
  const ms=monthsWindow(),inv={},rec={},w={firm:{},pen:{},can:{}};ms.forEach(m=>{inv[m]=0;rec[m]=0;w.firm[m]=0;w.pen[m]=0;w.can[m]=0});
  S.jobs.forEach(j=>{
    if(j.invoice&&j.status!=='cancelled'){const k=(j.invoice.issued||'').slice(0,7);if(k in inv)inv[k]+=totals(j).total}
    (j.payments||[]).forEach(p=>{const k=(p.date||'').slice(0,7);if(k in rec)rec[k]+=+p.amount||0});
    const k=(j.start||'').slice(0,7);if(k in inv){const g=j.status==='cancelled'?'can':(['heavy','blocked'].includes(j.status)?'pen':'firm');w[g][k]++}
  });
  return{ms,inv:ms.map(m=>r2(inv[m])),rec:ms.map(m=>r2(rec[m])),firm:ms.map(m=>w.firm[m]),pen:ms.map(m=>w.pen[m]),can:ms.map(m=>w.can[m])};
}
function vMoney(){
  const t=today(),m=t.slice(0,7),f=finSeries();
  const inv=S.jobs.filter(j=>j.invoice&&j.status!=='cancelled');
  const owed=inv.filter(j=>totals(j).balance>0).sort((a,b)=>(a.invoice.due||'').localeCompare(b.invoice.due||''));
  const pays=S.jobs.flatMap(j=>(j.payments||[]).map(p=>({...p,j}))).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const yr12=f.ms.filter(k=>k<=m);const sumIn=r2(f.inv.slice(0,10).reduce((a,b)=>a+b,0)),sumRec=r2(f.rec.slice(0,10).reduce((a,b)=>a+b,0));
  const toInvoice=S.jobs.filter(j=>j.status==='completed'&&!j.invoice&&totals(j).total>0);
  const byClient={};inv.forEach(j=>{if((j.invoice.issued||'')>=yr12[0]){const n=client(j.clientId)?.name||'No client';byClient[n]=(byClient[n]||0)+totals(j).total}});
  const top=Object.entries(byClient).sort((a,b)=>b[1]-a[1]).slice(0,5),topMax=top[0]?.[1]||1;
  const pipeline=r2(S.jobs.filter(j=>['confirmed','heavy'].includes(j.status)&&!j.invoice&&jobEnd(j)>=t).reduce((a,j)=>a+totals(j).total,0));
  return `<div class="stats">
    <div class="stat"><span class="lbl">Invoiced, last 10 months</span><span class="val">${money(sumIn)}</span></div>
    <div class="stat"><span class="lbl">Received, last 10 months</span><span class="val">${money(sumRec)}</span></div>
    <div class="stat"><span class="lbl">Owed to you</span><span class="val">${money(owed.reduce((a,j)=>a+totals(j).balance,0))}</span><span class="sub">${owed.length} invoices</span></div>
    <div class="stat"><span class="lbl">Booked, not yet invoiced</span><span class="val">${money(pipeline)}</span><span class="sub">Confirmed and pencilled</span></div>
  </div>
  <div class="card"><h2 class="sec">Money by month <span class="hint" style="text-transform:none;letter-spacing:0">Invoiced by issue date · received by payment date</span></h2><div class="chart-box"><canvas id="chFin" aria-label="Invoiced and received by month"></canvas></div></div>
  <div class="card"><h2 class="sec">Work coming in <span class="hint" style="text-transform:none;letter-spacing:0">Bookings by start month, incl. next 2 months</span></h2><div class="chart-box"><canvas id="chWork" aria-label="Bookings per month by status"></canvas></div></div>
  ${toInvoice.length?`<div class="sec-block"><h2 class="sec">Ready to invoice</h2><div class="list">${toInvoice.map(jobCard).join('')}</div></div>`:''}
  <div class="sec-block"><h2 class="sec">Unpaid invoices</h2>${owed.length?`<div class="card tscroll"><table class="t"><thead><tr><th>Invoice</th><th>Client</th><th>Due</th><th class="r">Balance</th></tr></thead><tbody>${owed.map(j=>{const ps=payState(j);return `<tr data-act="openJob" data-id="${j.id}" style="cursor:pointer"><td><b>${esc(j.invoice.no)}</b><br>${payPill(ps)}</td><td>${esc(client(j.clientId)?.name||'—')}</td><td style="${ps==='overdue'?'color:var(--bad);font-weight:600':''}">${fmtD(j.invoice.due,{day:'numeric',month:'short'})}</td><td class="r">${money(totals(j).balance)}</td></tr>`}).join('')}</tbody></table></div>`:`<div class="empty"><span>Every invoice is paid.</span></div>`}</div>
  ${top.length?`<div class="card"><h2 class="sec">Top clients, last 10 months</h2><div class="bar-list">${top.map(([n,v])=>`<div class="bar-row"><span>${esc(n)}</span><span class="num">${money(v)}</span><span class="track"><i style="width:${Math.max(3,v/topMax*100)}%"></i></span></div>`).join('')}</div></div>`:''}
  <div class="sec-block"><h2 class="sec">Recent payments</h2>${pays.length?`<div class="card">${pays.slice(0,12).map(p=>`<div class="pay"><span><b>${money(p.amount)}</b> · ${esc(client(p.j.clientId)?.name||p.j.title)}<br><small style="color:var(--ink-2)">${fmtD(p.date)} · ${esc(p.method||'')} ${p.j.invoice?'· '+esc(p.j.invoice.no):''}</small></span><button class="btn sm" data-act="openJob" data-id="${p.j.id}">Job</button></div>`).join('')}</div>`:`<div class="empty"><span>No payments recorded yet. Open a job and tap “Record payment”.</span></div>`}</div>
  <div class="card"><h2 class="sec">Export</h2><span class="hint">For your accountant, SARS VAT201 returns and provisional tax. Opens a save prompt.</span><div class="row"><button class="btn" data-act="exportJobs">Jobs & invoices (CSV)</button><button class="btn" data-act="exportPays">Payments (CSV)</button></div></div>`;
}
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
function drawCharts(){
  if(!window.Chart)return;
  const f=finSeries(),labels=f.ms.map(k=>pd(k+'-01').toLocaleDateString('en-ZA',{month:'short',year:'2-digit'}));
  const ink2=css('--ink-2'),line=css('--line'),font={family:'IBM Plex Sans, system-ui, sans-serif',size:11};
  const base={responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},

  const a=$('#chFin');if(a)S.charts.push(new Chart(a,{type:'bar',data:{labels,datasets:[
    {label:'Invoiced',data:f.inv,backgroundColor:css('--accent'),borderRadius:4,maxBarThickness:22},

  const b=$('#chWork');if(b)S.charts.push(new Chart(b,{type:'bar',data:{labels,datasets:[
    {label:'Confirmed / done',data:f.firm,backgroundColor:css('--st-confirmed'),borderRadius:3,maxBarThickness:26,stack:'s'},
    {label:'Pencilled / blocked',data:f.pen,backgroundColor:css('--st-heavy'),borderRadius:3,maxBarThickness:26,stack:'s'},

}

/* ---------- connectors ---------- */
function mcpMsg(e,server){
  switch(e?.code){
    case 'server_not_connected':case 'selection_required':return `${server} is not connected. Add it in claude.ai Settings → Connectors, then try again.`;
    case 'needs_reauth':return `Reconnect ${server} in claude.ai Settings → Connectors, then try again.`;
    case 'not_in_manifest':return `${server} is switched off for this app. Turn it on in the app's Permissions menu.`;
    case 'approval_required':case 'consent_required':return `${server} needs your approval. Tap the button again and choose Allow.`;
    case 'blocked_by_policy':return `Your organisation blocks this ${server} action.`;
    case 'tool_error':return `${server} said: ${e.message||'the request failed'}`;
    case 'server_unavailable':case 'upstream_error':return `${server} did not answer. Check ${server} before trying again, it may have gone through.`;
    default:return `${server} is not available here right now.`;
  }
}
function pickId(p){if(!p||typeof p!=='object')return null;return p.id||p.eventId||p.event?.id||p.result?.id||null}
async function syncCalendar(j){
  if(!S.mcp)throw {code:'not_granted'};
  const c=client(j.clientId),st=ST[j.status],timed=!!j.callTime,end=jobEnd(j);
  let startTime,endTime;
  if(timed){startTime=`${j.start}T${j.callTime}:00`;
    let fin=j.finishTime||'';
    if(!fin){const [h,m]=j.callTime.split(':').map(Number);fin=`${String(Math.min(23,h+1)).padStart(2,'0')}:${String(m).padStart(2,'0')}`}
    let ed=end;if(ed===j.start&&fin<=j.callTime)ed=addDays(ed,1);
    endTime=`${ed}T${fin}:00`;
  }else{startTime=`${j.start}T00:00:00`;endTime=`${addDays(end,1)}T00:00:00`}
  const prefix=j.status==='confirmed'?'':`[${st.label}] `;
  const desc=[`Status: ${st.label}`,c&&`Client: ${c.name}`,j.engineer&&`Engineer / tech: ${j.engineer}${j.role?' ('+j.role+')':''}`,j.siteContact&&`On-site: ${j.siteContact} ${j.sitePhone||''}`,j.po&&`PO / ref: ${j.po}`,j.notes&&`\n${j.notes}`,'\nManaged in My Booking 360'].filter(Boolean).join('\n');
  const input={...(S.settings.timeZone?{timeZone:S.settings.timeZone}:{}),summary:`${prefix}${j.title}${j.engineer?' — '+j.engineer:''}`,description:desc,location:[j.venue,j.address].filter(Boolean).join(', '),colorId:st.gcal,
    availability:['cancelled','notdone'].includes(j.status)?'AVAILABILITY_FREE':'AVAILABILITY_BUSY',allDay:!timed,startTime,endTime};
  if(!input.location)delete input.location;
  let id=j.calEventId;
  if(id){await S.mcp.callTool('Google Calendar','update_event',{eventId:id,notificationLevel:'NONE',...input})}
  else{const r=await S.mcp.callTool('Google Calendar','create_event',{...input,notificationLevel:'NONE'});id=pickId(r.payload)}
  return id;
}
async function doSync(j,quiet){
  try{const id=await syncCalendar(j);const fresh=clone(S.jobs.find(x=>x.id===j.id)||j);fresh.calEventId=id||fresh.calEventId||null;fresh.calSyncedAt=Date.now();fresh.calSync=true;await store.saveJob(fresh);if(!quiet||!j.calEventId)toast(id?'Google Calendar updated':'Added to Google Calendar');return true}
  catch(e){if(e?.code)toast(mcpMsg(e,'Google Calendar'),1);return false}
}

/* ---------- actions ---------- */
const ACT={
  tab:d=>{S.view=d.v;closeSheet();renderTabs();render();window.scrollTo(0,0)},
  newJob:d=>{const j=blankJob(d.date);if(d.client)j.clientId=d.client;openJobForm(j)},
  openJob:d=>openJob(d.id),
  editJob:d=>{const j=S.jobs.find(x=>x.id===d.id);if(j)openJobForm(j)},
  dupJob:d=>{const j=clone(S.jobs.find(x=>x.id===d.id));Object.assign(j,{id:newId(),status:'heavy',invoice:null,payments:[],calEventId:null,calSyncedAt:null,example:false,createdAt:Date.now(),_new:true});delete j.invoice;openJobForm(j)},
  closeSheet:()=>closeSheet(),
  copy:d=>copyText(d.t),
  jobFilter:d=>{S.jobFilter=d.v;render()},
  calDay:d=>{S.calSel=d.d;const m=d.d.slice(0,7)+'-01';if(m!==S.calMonth)S.calMonth=m;render()},
  calMove:d=>{const m=pd(S.calMonth);m.setMonth(m.getMonth()+ +d.n);S.calMonth=iso(m);render()},
  calToday:()=>{const n=new Date();S.calMonth=iso(new Date(n.getFullYear(),n.getMonth(),1));S.calSel=today();render()},
  draftStatus:(d,b)=>{S.draft.status=d.v;b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));checkClash()},
  addItem:d=>{S.draft.items=S.draft.items||[];const u=d.u||'day',auto=u==='day';S.draft.items.push({desc:d.d||'',qty:auto?bookDays(S.draft):1,unit:u,rate:d.r?+d.r:'',auto});renderItems();const n=S.draft.items.length-1;$(`#it-${d.d?'r':'d'}-${n}`)?.focus()},
  rmItem:d=>{S.draft.items.splice(+d.n,1);renderItems()},
  matchDays:()=>syncDayQty(true),
  setStatus:async(d,b)=>{const j=clone(S.jobs.find(x=>x.id===d.id));if(!j||j.status===d.v)return;j.status=d.v;await store.saveJob(j);toast(`Marked ${ST[d.v].label.toLowerCase()}`);if(j.calEventId&&S.mcp)doSync(j,true)},
  syncCal:async(d,b)=>{const j=S.jobs.find(x=>x.id===d.id);await busy(b,()=>doSync(j))},
  makeInvoice:async(d,b)=>{const j=clone(S.jobs.find(x=>x.id===d.id)),s=S.settings,no=`${s.invoicePrefix||''}${s.nextInvoiceNo}`;
    j.invoice={no,issued:today(),due:addDays(today(),+s.termsDays||0),gstRate:+s.gstRate||0,sentAt:null,reminders:[]};
    await busy(b,async()=>{await store.saveSettings({nextInvoiceNo:(+s.nextInvoiceNo||0)+1});await store.saveJob(j)});toast(`Invoice ${no} created`)},
  markSent:async d=>{const j=clone(S.jobs.find(x=>x.id===d.id));j.invoice.sentAt=Date.now();await store.saveJob(j);toast('Marked as sent')},
  pdfInv:async d=>{const j=S.jobs.find(x=>x.id===d.id);if(!window.jspdf){toast('The PDF maker did not load. Reload and try again.',1);return}await saveFile(invFileName(j),buildPdf(j).output('blob'))},
  emailInv:d=>{const j=S.jobs.find(x=>x.id===d.id);if(!window.jspdf){toast('The PDF maker did not load. Reload and try again.',1);return}openEmail(j)},
  emailDraft:async(d,b)=>{const fm=$('#emailForm');if(!fm.reportValidity())return;const j=S.jobs.find(x=>x.id===d.id);
    await busy(b,async()=>{try{const r=await S.mcp.callTool('Gmail','create_draft',emailPayload(j,fm));const url=r.payload?.viewUrl;
      $('#sheetCard .sheet-body').insertAdjacentHTML('afterbegin',`<div class="banner"><span><b>Saved to your Gmail drafts.</b> Review and send it from Gmail.</span>${url?`<a class="btn sm" href="${esc(url)}" target="_blank" rel="noopener">Open draft</a>`:''}</div>`)}
      catch(e){toast(mcpMsg(e,'Gmail'),1)}})},
  showPay:()=>{$('#payForm').hidden=false;$('#pay-amount').focus()},
  hidePay:()=>{$('#payForm').hidden=true},
  delPay:async d=>{const j=clone(S.jobs.find(x=>x.id===d.id));j.payments=(j.payments||[]).filter(p=>p.id!==d.p);await store.saveJob(j);toast('Payment removed')},
  askDel:()=>{$('#delConfirm').hidden=false;$('#delConfirm').scrollIntoView({block:'nearest'})},
  cancelDel:()=>{$('#delConfirm').hidden=true},
  delJob:async(d,b)=>{const j=S.jobs.find(x=>x.id===d.id);await busy(b,async()=>{
    if(j.calEventId&&S.mcp){try{await S.mcp.callTool('Google Calendar','delete_event',{eventId:j.calEventId,notificationLevel:'NONE'})}catch(e){toast(mcpMsg(e,'Google Calendar')+' The calendar event may still be there.',1)}}
    await store.deleteJob(d.id)});closeSheet();toast('Booking deleted')},
  newClient:()=>openClientForm(),
  openClient:d=>openClient(d.id),
  editClient:d=>openClientForm(clone(client(d.id))),
  delClient:async d=>{await store.deleteClient(d.id);closeSheet();toast('Client deleted')},
  clearExamples:async(d,b)=>{await busy(b,async()=>{for(const j of S.jobs.filter(x=>x.example))await store.deleteJob(j.id);for(const c of S.clients.filter(x=>x.example))await store.deleteClient(c.id)});toast('Examples removed')},
  exportJobs:()=>{const rows=[['Start','End','Job','Client','Engineer','Role','Venue','Status','PO','Subtotal','VAT','Total','Invoice','Issued','Due','Paid','Balance']];
    S.jobs.forEach(j=>{const t=totals(j);rows.push([j.start,jobEnd(j),j.title,client(j.clientId)?.name||'',j.engineer,j.role,j.venue,ST[j.status]?.label,j.po,t.sub,t.gst,t.total,j.invoice?.no||'',j.invoice?.issued||'',j.invoice?.due||'',t.paid,j.invoice?t.balance:''])});
    saveFile(`my-booking-360-jobs-${today()}.csv`,rows.map(r=>r.map(csvCell).join(',')).join('\n'))},
  exportPays:()=>{const rows=[['Date','Amount','Method','Note','Invoice','Job','Client']];
    S.jobs.forEach(j=>(j.payments||[]).forEach(p=>rows.push([p.date,p.amount,p.method,p.note,j.invoice?.no||'',j.title,client(j.clientId)?.name||''])));
    saveFile(`my-booking-360-payments-${today()}.csv`,rows.map(r=>r.map(csvCell).join(',')).join('\n'))},
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;if(b.tagName==='A')return;const f=ACT[b.dataset.act];if(f){e.preventDefault();f(b.dataset,b,e)}});
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='jobSearch'){S.search=t.value;const pos=t.selectionStart;render();const n=$('#jobSearch');n.focus();n.setSelectionRange(pos,pos)}
  else if(t.id==='clientSearch'){S.clientSearch=t.value;const pos=t.selectionStart;render();const n=$('#clientSearch');n.focus();n.setSelectionRange(pos,pos)}
  else if(t.dataset.item&&S.draft){const row=t.closest('.item'),n=+row.dataset.n,it=S.draft.items[n];it[t.dataset.item]=t.dataset.item==='desc'||t.dataset.item==='unit'?t.value:(t.value===''?'':+t.value);
    if(t.dataset.item==='qty')it.auto=false;
    if(t.dataset.item==='unit'){it.auto=t.value==='day';if(it.auto){it.qty=bookDays(S.draft);row.querySelector('[data-item=qty]').value=it.qty}}
    renderDayHint();row.querySelector('.amt').textContent=money((+it.qty||0)*(+it.rate||0));renderDraftTotals()}
  else if(S.draft&&t.form?.id==='jobForm'&&['start','end','engineer'].includes(t.name)){S.draft[t.name]=t.value;checkClash();if(t.name!=='engineer')syncDayQty()}
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='curSel'){const old=S.settings.currency;try{await store.saveSettings({currency:t.value});toast(`Currency set to ${t.value}`)}catch{t.value=old}return}
  if(t.id==='jf-gst'&&S.draft){S.draft.gst=t.checked;renderDraftTotals()}
  if(t.id==='jf-clientId'){$('#newClientBox').hidden=t.value!=='__new';if(t.value==='__new')$('#jf-ncName').focus()}
  if(t.dataset.actChange==='invDate'&&t.value){const j=clone(S.jobs.find(x=>x.id===t.dataset.id));j.invoice[t.dataset.k]=t.value;await store.saveJob(j);toast('Invoice date saved')}
});
document.addEventListener('submit',async e=>{
  const fm=e.target,kind=fm.dataset.form;if(!kind)return;e.preventDefault();
  const btns=[...fm.querySelectorAll('button[type=submit]'),...(fm.id?document.querySelectorAll(`button[form="${fm.id}"]`):[])];btns.forEach(b=>b.disabled=true);
  try{
  if(kind==='job'){
    readJobForm();const d=S.draft;
    if(d.clientId==='__new'){const name=$('#jf-ncName').value.trim();if(!name){toast('Enter the new client name.',1);$('#jf-ncName').focus();return}
      const c={id:newId(),name,email:$('#jf-ncEmail').value.trim(),contact:'',phone:'',address:'',abn:'',notes:''};await store.saveClient(c);d.clientId=c.id}
    const isNew=!!d._new;delete d._new;const job=clone(d);await store.saveJob(job);
    closeSheet();toast(isNew?'Booking saved':'Changes saved');
    if(job.calSync&&S.mcp)doSync(job,true);
    else if(!job.calSync&&job.calEventId){}
    if(S.view!=='cal'&&S.view!=='jobs'&&S.view!=='home'){}
    setTimeout(()=>openJob(job.id),50);
  }else if(kind==='client'){
    const c={id:fm.dataset.id};['name','contact','email','phone','address','abn','notes'].forEach(k=>c[k]=fm.elements[k].value.trim());
    const prev=client(c.id);await store.saveClient({...(prev||{}),...c,example:prev?.example||false});closeSheet();toast('Client saved');openClient(c.id);
  }else if(kind==='settings'){
    const v={};[...fm.elements].forEach(el=>{if(!el.name)return;v[el.name]=el.type==='checkbox'?el.checked:el.type==='number'?(el.value===''?0:+el.value):el.value.trim()});
    await store.saveSettings(v);toast('Settings saved');
  }else if(kind==='payment'){
    const j=clone(S.jobs.find(x=>x.id===fm.dataset.id));j.payments=j.payments||[];
    j.payments.push({id:newId(),amount:r2(fm.elements.amount.value),date:fm.elements.date.value,method:fm.elements.method.value,note:fm.elements.note.value.trim()});
    j.payments.sort((a,b)=>a.date.localeCompare(b.date));
    const t=totals(j);if(j.invoice&&t.balance<=0&&j.status==='confirmed')j.status='completed';
    await store.saveJob(j);toast(t.balance<=0&&t.total>0?'Payment saved. Paid in full.':`Payment saved. ${money(t.balance)} still owing.`);
  }else if(kind==='email'){
    const j=S.jobs.find(x=>x.id===fm.dataset.id),rem=!!fm.dataset.rem,btn=$('#sendBtn');
    await busy(btn,async()=>{try{await S.mcp.callTool('Gmail','send_message',emailPayload(j,fm));
      const fresh=clone(S.jobs.find(x=>x.id===j.id));const to=fm.elements.to.value.trim();
      if(rem){fresh.invoice.reminders=[...(fresh.invoice.reminders||[]),Date.now()]}else{fresh.invoice.sentAt=Date.now();fresh.invoice.sentTo=to}
      await store.saveJob(fresh);toast(`${rem?'Reminder':'Invoice'} sent to ${to}`);openJob(j.id)}
      catch(err){toast(mcpMsg(err,'Gmail'),1)}});
  }}catch(err){console.error(err)}finally{btns.forEach(b=>{if(b.isConnected)b.disabled=false})}
});
boot();
</script>

</body></html>
